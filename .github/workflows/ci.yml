name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-tests:
    name: hook-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate hook shell syntax
        run: bash -n scripts/memory-bank-hook.sh
      - name: Validate plugin metadata JSON
        run: python -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Run sandboxed hook tests
        run: python -m unittest discover -s tests -v
