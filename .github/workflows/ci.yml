name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hook-tests:
    name: hook-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - name: Validate hook shell syntax
        run: bash -n scripts/memory-bank-hook.sh
      - name: Lint hook with shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S style scripts/*.sh
      - name: Validate plugin metadata JSON
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Run sandboxed hook tests
        run: python3 -m unittest discover -s tests -v
